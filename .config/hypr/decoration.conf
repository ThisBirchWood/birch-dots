general {
    # Gaps & borders – light and uncluttered
    gaps_in = 4
    gaps_out = 6
    gaps_workspaces = 32

    border_size = 1
    col.active_border = rgba(0DB7D4FF)
    col.inactive_border = rgba(31313633)

    no_focus_fallback = true
    allow_tearing = true

    snap {
        enabled = true
        window_gap = 4
        monitor_gap = 6
        respect_gaps = true
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
}

decoration {
    rounding = 10

    shadow {
        enabled = yes
        range = 16
        render_power = 2
        color = rgba(00000040)
    }

    blur {
        enabled = yes
        size = 5
        passes = 2
        vibrancy = 0.14
    }
}

animations {
    enabled = yes

    # Light, fast easing — no bounce, no drag
    bezier = breeze, 0.22, 0.61, 0.36, 1.15

    # Windows: quick, soft, intentional
    animation = windows, 1, 5, breeze, slidefade
    animation = windowsOut, 1, 4, breeze, slidefade

    # Workspaces: airy glide, finishes fast
    animation = workspaces, 1, 1, breeze, slidefade

    # Subtle polish
    animation = fade, 1, 4, breeze
    animation = windowsMove, 1, 3, breeze
    animation = border, 1, 3, breeze
}




